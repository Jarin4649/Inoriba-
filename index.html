<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden; /* ปิด Scrollbar ไม่ให้เลื่อนขึ้นลงได้ */
    }

    /* กรอบหน้าจอเกม ยึดตามขนาดหน้าจอคอมพิวเตอร์พอดี */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* <--- จุดสำคัญ: ดันลงข้างล่าง */
      align-items: center;
      padding: 20px;
    }

    /* กล่องข้อความสไตล์ Visual Novel (กว้างกำลังสวย 800px วางอยู่กึ่งกลางด้านล่าง) */
#story-screen {
  position: absolute; /* บังคับลอยตำแหน่ง */
  bottom: 80px;       /* ห่างจากขอบล่าง 80px */
  left: 50%;
  transform: translateX(-50%); /* จัดให้อยู่กึ่งกลางแนวนอน */
  width: 90%;
  max-width: 850px;
  height: 160px;
  background: rgba(40, 40, 40, 0.65);
  border: none;
  border-radius: 8px;
  padding: 15px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
  z-index: 10;
}

    .speaker-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .dialog-text {
      font-size: 1.05rem;
      color: #eeeeee;
      line-height: 1.5;
      flex-grow: 1;
    }

    .next-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid #eeeeee;
      color: #eeeeee;
      padding: 5px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: #eeeeee;
      color: #000000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    
   }
    
  </style>
</head>
<body>

<div id="story-screen">
  <div class="speaker-name" id="speaker">Atsushi</div>
  <div class="dialog-text" id="text">It's been two weeks now, and the police still haven't found any trace of Riko.</div>
  <button class="next-btn" onclick="nextText()">Next ▶</button>
</div>

  <script>
    const dialogs = [
      { speaker: "Atsushi", text: "It's been two weeks now, and the police still haven't found any trace of Riko." },
      { speaker: "Kana", text: "I wonder how our daughter is doing right now... The police are utterly useless. What on earth are our tax ｍoney even paying for?" },
      { speaker: "Atsushi", text: "Calm down, honey. The police are doing everything they can. I'm sure our daughter is still safe... I really believe that." },
      { speaker: "Kana", text: "I hope you're right. But how can you stay so calm? It's been way too long, and there's still zero progress." },
      { speaker: "Atsushi", text: "I'm just as worried as you are... but there's literally nothing we can do." },
      { speaker: "Kana", text: "Can't do anything? Or are you just refusing to do something about it?" },
      { speaker: "Atsushi", text: "..." },
      { speaker: "Kana", text: "God, you're so damn pathetic" },
      { speaker: "Atsushi", text: "I'm sorry. Fine... then I'll look for clues myself." },
      { speaker: "Kana", text: "What can someone like you even do? Do whatever you want." },
      { speaker: "Atsushi", text: "Sorry..." },
    ];

 let currentIndex = 0;

  function nextText() {
    if (currentIndex < dialogs.length - 1) {
      currentIndex++;
      document.getElementById("speaker").innerText = dialogs[currentIndex].speaker;
      document.getElementById("text").innerText = dialogs[currentIndex].text;
    }
    // เอาโฟกัสออกจากปุ่ม เพื่อไม่ให้ตีกับการกด Enter บนคีย์บอร์ด
    if (document.activeElement) {
      document.activeElement.blur();
    }
  }

  // ดักจับการกดปุ่มบนคีย์บอร์ด (Enter และ Spacebar)
  window.addEventListener("keydown", function(event) {
    if (event.key === "Enter" || event.code === "Space") {
      event.preventDefault(); // ป้องกันหน้าจอเลื่อน
      nextText();
    }
  });
</script>
