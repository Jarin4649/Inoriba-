<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inoriba (祈り場)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* หัวข้อเกมด้านบน */
    .game-title {
      text-align: center;
      margin-bottom: 15px;
    }
    .game-title h1 {
      color: #ff3333;
      font-size: 1.8rem;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
    }
    .game-title p {
      font-size: 0.8rem;
      color: #666;
    }

    /* กรอบหน้าจอเกม (ขนาดมาตรฐาน 960x540 Pixels) */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background: #0a0a0f;
      border: 2px solid #333;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 20px;
      overflow: hidden;
    }

    /* กล่องข้อความด้านล่าง พอดีกับสัดส่วนเกม */
    #story-screen {
      position: relative;
      width: 90%;
      height: 140px;
      background: rgba(10, 10, 15, 0.92);
      border: 2px solid #ff3333;
      border-radius: 4px;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
    }

    .speaker-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .dialog-text {
      font-size: 1rem;
      color: #dddddd;
      line-height: 1.5;
      flex-grow: 1;
    }

    .next-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid #ff3333;
      color: #ff3333;
      padding: 4px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: #ff3333;
      color: #000;
    }
  </style>
</head>
<body>

  <h1>祈り場 (Inoriba)</h1>
  <div class="subtitle">Hack Club Stardance Project</div>

  <div id="game-container">
    <div id="story-screen">
      <div class="speaker-name" id="speaker">???</div>
      <button class="next-btn" onclick="nextText()">กดเพื่อไปต่อ ▶</button>
    </div>
  </div>

  <script>
    const dialogs = [
      { speaker: "Atsushi", text: "It's been two weeks now, and the police still haven't found any trace of Riko." },
      { speaker: "Kana", text: "I wonder how our daughter is doing right now... The police are utterly useless. What on earth are our tax ｍoney even paying for?" },
      { speaker: "Atsushi", text: "Calm down, honey. The police are doing everything they can. I'm sure our daughter is still safe... I really believe that." },
      { speaker: "Kana", text: "I hope you're right. But how can you stay so calm? It's been way too long, and there's still zero progress." },
      { speaker: "Atsushi", text: "I'm just as worried as you are... but there's literally nothing we can do." },
      { speaker: "Kana", text: "Can't do anything? Or are you just refusing to do something about it?" },
      { speaker: "Atsushi", text: "..." },
      { speaker: "Kana", text: "God, you're so damn pathetic" },
      { speaker: "Atsushi", text: "I'm sorry. Fine... then I'll look for clues myself." },
      { speaker: "Kana", text: "What can someone like you even do? Do whatever you want." },
      { speaker: "Atsushi", text: "Sorry..." },
    ];

    let currentIndex = 0;

    function nextText() {
      currentIndex++;
      if (currentIndex < dialogs.length) {
        document.getElementById("speaker").innerText = dialogs[currentIndex].speaker;
        document.getElementById("text").innerText = dialogs[currentIndex].text;
      } else {
        document.getElementById("speaker").innerText = "ระบบ";
        document.getElementById("text").innerText = "จบฉากนำเรื่อง (Prologue)";
      }
    }
  </script>
</body>
</html>
