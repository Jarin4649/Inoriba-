<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050508;
      color: #e0e0e0;
      font-family: 'Anonymous Pro', Courier, monospace;
      overflow: hidden; /* ปิด Scrollbar ไม่ให้เลื่อนขึ้นลงได้ */
    }

 /* กรอบหน้าจอเกม ยึดตามขนาดหน้าจอคอมพิวเตอร์พอดี */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050508;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px;
/* ดึงรูปจากโฟลเดอร์ Images */
      background-image: url('Images/House1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }
      
/* กล่องครอบตัวละคร ยึดติดพื้นล่างแน่น 100% */
    .character-box {
      position: absolute;
      bottom: 0;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
      z-index: 5;
    }

    /* วาง Kana ไว้ฝั่งซ้าย ขยับเข้ามาในจอหน่อย */
    #left-char-box {
      left: 5vw;
      justify-content: flex-start;
    }

    /* วาง Atsushi ไว้ฝั่งขวา ขยับเข้ามาในจอหน่อย */
    #right-char-box {
      right: 5vw;
      justify-content: flex-end;
    }

    /* สัดส่วนตัวละคร 78vh พอดีแน่นกรอบสวยงาม */
    .character {
      height: 78vh;
      max-height: 650px;
      object-fit: contain;
      transition: filter 0.3s ease, transform 0.2s ease, opacity 0.3s ease;
      filter: brightness(50%);
      opacity: 0.95;
    }

    .character.active {
      filter: brightness(100%);
      opacity: 1;
      transform: scale(1.02);
    }
    
/* กล่องข้อความ */
    #story-screen {
      position: absolute;
      bottom: 25px;      
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      max-width: 650px;
      height: 150px;
      background: rgba(40, 40, 40, 0.75);
      border: none;
      border-radius: 8px;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* จัดเรียงจากบนลงล่าง */
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
      z-index: 10;
    }
    
    .speaker-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #eeeeee;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .dialog-text {
      font-size: 1.05rem;
      color: #eeeeee;
      line-height: 1.5;
      flex-grow: 1;
    }

/* ปรับปุ่ม Next ให้ลอยยึดมุมขวาล่างตลอดเวลา ไม่โดนตัวหนังสือดัน */
    .next-btn {
      position: absolute;
      bottom: 12px;
      right: 15px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #eeeeee;
      color: #eeeeee;
      padding: 4px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

.next-btn:hover {
      background: #eeeeee;
      color: #000000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    }
    
  </style>
</head>
<body>

<div id="game-container">
    <!-- ฝั่งซ้าย: Kana -->
    <div id="left-char-box" class="character-box">
      <img id="char-kana" class="character" src="Characters/Kana Q.png" alt="Kana">
    </div>

    <!-- ฝั่งขวา: Atsushi -->
    <div id="right-char-box" class="character-box">
      <img id="char-atsushi" class="character active" src="Characters/Atsushi speak.png" alt="Atsushi">
    </div>

    <div id="story-screen" class="speaker-right">
      <div class="speaker-name" id="speaker">Atsushi</div>
      <div class="dialog-text" id="text">It's been two weeks now, and the police still haven't found any trace of Riko.</div>
      <button class="next-btn" onclick="nextText()">Next ▶</button>
    </div>
  </div>

  <script>
    const dialogs = [
      { 
        speaker: "Atsushi", 
        text: "It's been two weeks now, and the police still haven't found any trace of Riko.", 
        imageAtsushi: "Characters/Atsushi speak.png", 
        imageKana: "Characters/Kana Q.png"
      },
      { 
        speaker: "Kana", 
        text: "I wonder how our daughter is doing right now... The police are utterly useless. What on earth are our tax money even paying for?", 
        imageAtsushi: "Characters/Atsushi Q (1).png",
        imageKana: "Characters/Kana speak.png" 
      },
      { 
        speaker: "Atsushi", 
        text: "Calm down, honey. The police are doing everything they can. I'm sure our daughter is still safe... I really believe that.", 
        imageAtsushi: "Characters/Atsushi speak.png", 
        imageKana: "Characters/Kana Q.png"
      },
      { 
        speaker: "Kana", 
        text: "I hope you're right. But how can you stay so calm? It's been way too long, and there's still zero progress.", 
        imageAtsushi: "Characters/Atsushi Q (1).png", 
        imageKana: "Characters/Kana speak.png" 
      },
      { 
        speaker: "Atsushi", 
        text: "I'm just as worried as you are... but there's literally nothing we can do.", 
        imageAtsushi: "Characters/Atsushi speak.png",
        imageKana: "Characters/Kana Q.png"
      },
      { 
        speaker: "Kana", 
        text: "Can't do anything? Or are you just refusing to do something about it?", 
        imageAtsushi: "Characters/Atsushi Q (1).png", 
        imageKana: "Characters/Kana Angry1.png" 
      },
      { 
        speaker: "Atsushi", 
        text: "...", 
        imageAtsushi: "Characters/Atsushi Q (1).png",
        imageKana: "Characters/Kana Angry1.png"
      },
      { 
        speaker: "Kana", 
        text: "God, you're so damn pathetic", 
        imageAtsushi: "Characters/Atsushi Q (1).png", 
        imageKana: "Characters/Kana Angry1.png" 
      },
      { 
        speaker: "Atsushi", 
        text: "I'm sorry. Fine... then I'll look for clues myself.", 
        imageAtsushi: "Characters/Atsushi speak.png",
        imageKana: "Characters/Kana Angry1.png"
      },
      { 
        speaker: "Kana", 
        text: "What can someone like you even do? Do whatever you want.", 
        imageAtsushi: "Characters/Atsushi Q (1).png", 
        imageKana: "Characters/Kana Angry2.png" 
      },
      { 
        speaker: "Atsushi", 
        text: "Sorry...", 
        imageAtsushi: "Characters/Atsushi Sorry.png", 
        imageKana: "Characters/Kana Angry2.png"
      },
    ];
    
let currentIndex = 0;

    function nextText() {
      if (currentIndex < dialogs.length - 1) {
        currentIndex++;
        const currentDialog = dialogs[currentIndex];
        
        document.getElementById("speaker").innerText = currentDialog.speaker;
        document.getElementById("text").innerText = currentDialog.text;

        const atsushiImg = document.getElementById("char-atsushi");
        const kanaImg = document.getElementById("char-kana");
        const storyScreen = document.getElementById("story-screen");

        // อัปเดตรูปของ Atsushi (ถ้ามีในข้อความนั้น)
        if (currentDialog.imageAtsushi) {
          atsushiImg.src = currentDialog.imageAtsushi;
        }
        // อัปเดตรูปของ Kana (ถ้ามีในข้อความนั้น)
        if (currentDialog.imageKana) {
          kanaImg.src = currentDialog.imageKana;
        }

        // สลับสถานะพูด/มืด และติ่งแหลม
        if (currentDialog.speaker === "Atsushi") {
          atsushiImg.classList.add("active");
          kanaImg.classList.remove("active");

          storyScreen.classList.remove("speaker-left");
          storyScreen.classList.add("speaker-right");
        } else if (currentDialog.speaker === "Kana") {
          kanaImg.classList.add("active");
          atsushiImg.classList.remove("active");

          storyScreen.classList.remove("speaker-right");
          storyScreen.classList.add("speaker-left");
        }
      }

      if (document.activeElement) {
        document.activeElement.blur();
      }
    }

    window.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.code === "Space") {
        event.preventDefault();
        nextText();
      }
    });
  </script>
</body>
</html>
