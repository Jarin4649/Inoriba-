<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050508;
      color: #e0e0e0;
      font-family: 'Anonymous Pro', Courier, monospace;
      overflow: hidden; /* ปิด Scrollbar ไม่ให้เลื่อนขึ้นลงได้ */
    }

 /* กรอบหน้าจอเกม ยึดตามขนาดหน้าจอคอมพิวเตอร์พอดี */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050508;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px;
/* ดึงรูปจากโฟลเดอร์ Images */
      background-image: url('Images/House1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }
      
   /* จัดวางฝั่งขวา ชิดขอบล่าง และดันให้ชิดขอบจอมากขึ้น */
    #character-container {
      position: absolute;
      bottom: 5;
      right: -6px; /* <--- เพิ่มค่าติดลบเพื่อให้ชิดขวามากขึ้น (ถ้าอยากได้ชิดกว่านี้อีก ลองปรับเป็น -120px หรือมากกว่า) */
      width: 500px; 
      height: 85vh;
      z-index: 5;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
    }

    /* ปรับค่าตัวละครไม่โปร่งแสง แต่เป็นสีเทาเมื่อไม่ได้พูด */
    .character {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom right;
      transition: filter 0.3s ease, transform 0.2s ease; /* เอา opacity ออกจาก transition */
      
      /* ทำให้เป็นสีเทา/มืดลง 60% */
      filter: brightness(60%);
      
      /* ทำให้ไม่โปร่งแสง (opacity เต็ม 1) */
      opacity: 1; /* <--- เพิ่มตัวนี้เพื่อให้ความเข้มเต็ม 100% เสมอ */
    }

    /* เมื่อตัวละครพูด */
    .character.active {
      filter: brightness(100%);
      transform: scale(1.03);
    }
    
    /* กล่องข้อความสไตล์ Visual Novel (กว้างกำลังสวย 800px วางอยู่กึ่งกลางด้านล่าง) */
#story-screen {
  position: absolute; /* บังคับลอยตำแหน่ง */
  bottom: 80px;       /* ห่างจากขอบล่าง 80px */
  left: 50%;
  transform: translateX(-50%); /* จัดให้อยู่กึ่งกลางแนวนอน */
  width: 90%;
  max-width: 850px;
  height: 160px;
  background: rgba(40, 40, 40, 0.65);
  border: none;
  border-radius: 8px;
  padding: 15px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
  z-index: 10;
}

    .speaker-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #eeeeee;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .dialog-text {
      font-size: 1.05rem;
      color: #eeeeee;
      line-height: 1.5;
      flex-grow: 1;
    }

    .next-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid #eeeeee;
      color: #eeeeee;
      padding: 5px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: #eeeeee;
      color: #000000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    
   }
    
  </style>
</head>
<body>

<div id="game-container">
    <!-- แสดงรูป Atsushi ทางฝั่งซ้าย -->
    <div id="character-container">
      <img id="char-atsushi" class="character active" src="Characters/Atsushi speak.png" alt="Atsushi">
    </div>

    <div id="story-screen">
      <div class="speaker-name" id="speaker">Atsushi</div>
      <div class="dialog-text" id="text">It's been two weeks now, and the police still haven't found any trace of Riko.</div>
      <button class="next-btn" onclick="nextText()">Next ▶</button>
    </div>
  </div>

  <script>
    const dialogs = [
      { speaker: "Atsushi", text: "It's been two weeks now, and the police still haven't found any trace of Riko." },
      { speaker: "Kana", text: "I wonder how our daughter is doing right now... The police are utterly useless. What on earth are our tax ｍoney even paying for?" },
      { speaker: "Atsushi", text: "Calm down, honey. The police are doing everything they can. I'm sure our daughter is still safe... I really believe that." },
      { speaker: "Kana", text: "I hope you're right. But how can you stay so calm? It's been way too long, and there's still zero progress." },
      { speaker: "Atsushi", text: "I'm just as worried as you are... but there's literally nothing we can do." },
      { speaker: "Kana", text: "Can't do anything? Or are you just refusing to do something about it?" },
      { speaker: "Atsushi", text: "..." },
      { speaker: "Kana", text: "God, you're so damn pathetic" },
      { speaker: "Atsushi", text: "I'm sorry. Fine... then I'll look for clues myself." },
      { speaker: "Kana", text: "What can someone like you even do? Do whatever you want." },
      { speaker: "Atsushi", text: "Sorry..." },
    ];

let currentIndex = 0;

    function nextText() {
      if (currentIndex < dialogs.length - 1) {
        currentIndex++;
        const currentDialog = dialogs[currentIndex];
        
        document.getElementById("speaker").innerText = currentDialog.speaker;
        document.getElementById("text").innerText = currentDialog.text;

        // ไฮไลต์ Atsushi เมื่อเป็นคนพูด และทำให้มืดลงเมื่อ Kana พูด
        const atsushiImg = document.getElementById("char-atsushi");
        if (currentDialog.speaker === "Atsushi") {
          atsushiImg.classList.add("active");
        } else {
          atsushiImg.classList.remove("active");
        }
      }

      if (document.activeElement) {
        document.activeElement.blur();
      }
    }

    window.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.code === "Space") {
        event.preventDefault();
        nextText();
      }
    });
  </script>
</body>
</html>
