<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inoriba (祈り場) - Prologue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #ff3333;
      margin-bottom: 5px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }
    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 20px;
    }

    /* กรอบเกมขยายเป็น 16:9 (640x360) */
    #game-container {
      position: relative;
      border: 3px solid #333;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      background: #000;
      width: 640px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* กล่องข้อความทรงสี่เหลี่ยมผืนผ้าแนวยาวชิดด้านล่าง */
    #story-screen {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      height: 110px;
      background: rgba(10, 10, 15, 0.95);
      border: 2px solid #ff3333;
      border-radius: 4px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.25);
    }

    .speaker-name {
      font-size: 1rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .dialog-text {
      font-size: 0.95rem;
      color: #dddddd;
      line-height: 1.4;
      flex-grow: 1;
    }

    .next-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid #ff3333;
      color: #ff3333;
      padding: 3px 12px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: #ff3333;
      color: #000;
    }
  </style>
</head>
<body>

  <h1>祈り場 (Inoriba)</h1>
  <div class="subtitle">Hack Club Stardance Project</div>

  <div id="game-container">
    <div id="story-screen">
      <div class="speaker-name" id="speaker">???</div>
      <div class="dialog-text" id="text">...ฝนตกหนักข้างนอก เสียงวิทยุเริ่มส่งเสียงซ่า...</div>
      <button class="next-btn" onclick="nextText()">กดเพื่อไปต่อ ▶</button>
    </div>
  </div>

  <script>
    const dialogs = [
      { speaker: "บรรยาย", text: "...ฝนตกหนักข้างนอก เสียงวิทยุเริ่มส่งเสียงซ่า..." },
      { speaker: "ตำรวจ", text: "ทางเรากำลังพยายามอย่างเต็มที่ครับ ขอให้คุณกลับไปรอฟังข่าวที่บ้านก่อน..." },
      { speaker: "พ่อ/แม่", text: "ทำงานช้าเกินไปแล้ว... ลูกฉันหายไปทั้งคนนะ!" },
      { speaker: "พ่อ/แม่", text: "ถ้าพวกคุณไม่ช่วย... ฉันจะออกตามหาเอง" }
    ];

    let currentIndex = 0;

    function nextText() {
      currentIndex++;
      if (currentIndex < dialogs.length) {
        document.getElementById("speaker").innerText = dialogs[currentIndex].speaker;
        document.getElementById("text").innerText = dialogs[currentIndex].text;
      } else {
        document.getElementById("speaker").innerText = "ระบบ";
        document.getElementById("text").innerText = "จบฉากนำเรื่อง (Prologue)";
      }
    }
  </script>
</body>
</html>
