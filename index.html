<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050508;
      color: #e0e0e0;
      font-family: 'Anonymous Pro', Courier, monospace;
      overflow: hidden; /* ปิด Scrollbar ไม่ให้เลื่อนขึ้นลงได้ */
    }

 /* กรอบหน้าจอเกม ยึดตามขนาดหน้าจอคอมพิวเตอร์พอดี */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050508;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px;
/* ดึงรูปจากโฟลเดอร์ Images */
      background-image: url('Images/House1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }
      
/* --- กรอบจัดวางตัวละครซ้าย-ขวา --- */
.character-box {
  position: absolute;
  bottom: 0;
  width: 50vw;
  height: 100vh;
  z-index: 5;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
}

/* ฝั่งซ้าย (Kana) */
#left-char-box {
  left: 0;
  justify-content: flex-start;
}

/* ฝั่งขวา (Atsushi) */
#right-char-box {
  right: 0;
  justify-content: flex-end;
}

.character {
  height: 90vh;
  object-fit: contain;
  transition: filter 0.3s ease, transform 0.2s ease;
  filter: brightness(40%);
  opacity: 1;
}

.character.active {
  filter: brightness(100%);
  transform: scale(1.03);
}
    
    /* กล่องข้อความสไตล์ Visual Novel (กว้างกำลังสวย 800px วางอยู่กึ่งกลางด้านล่าง) */
#story-screen {
  position: absolute; /* บังคับลอยตำแหน่ง */
  bottom: 25px;      
  left: 50%;
  transform: translateX(-50%); /* จัดให้อยู่กึ่งกลางแนวนอน */
  width: 75%;
  max-width: 850px;
  height: 150px;
  background: rgba(40, 40, 40, 0.65);
  border: none;
  border-radius: 8px;
  padding: 15px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
  z-index: 10;
}
    
    .speaker-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #eeeeee;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .dialog-text {
      font-size: 1.05rem;
      color: #eeeeee;
      line-height: 1.5;
      flex-grow: 1;
    }

    .next-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid #eeeeee;
      color: #eeeeee;
      padding: 5px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: #eeeeee;
      color: #000000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    
   }
    
  </style>
</head>
<body>

<div id="game-container">
    <!-- ฝั่งซ้าย: Kana -->
    <div id="left-char-box" class="character-box">
      <img id="char-kana" class="character" src="Characters/Kana.png" alt="Kana">
    </div>

    <!-- ฝั่งขวา: Atsushi -->
    <div id="right-char-box" class="character-box">
      <img id="char-atsushi" class="character active" src="Characters/Atsushi speak.png" alt="Atsushi">
    </div>

    <div id="story-screen" class="speaker-right">
      <div class="speaker-name" id="speaker">Atsushi</div>
      <div class="dialog-text" id="text">It's been two weeks now, and the police still haven't found any trace of Riko.</div>
      <button class="next-btn" onclick="nextText()">Next ▶</button>
    </div>
  </div>

  <script>
    const dialogs = [
      { speaker: "Atsushi", text: "It's been two weeks now, and the police still haven't found any trace of Riko.", image: "Characters/Atsushi speak.png" },
      { speaker: "Kana", text: "I wonder how our daughter is doing right now... The police are utterly useless. What on earth are our tax ｍoney even paying for?" },
      { speaker: "Atsushi", text: "Calm down, honey. The police are doing everything they can. I'm sure our daughter is still safe... I really believe that.", image: "Characters/Atsushi speak.png" },
      { speaker: "Kana", text: "I hope you're right. But how can you stay so calm? It's been way too long, and there's still zero progress.", image: "Characters/Atsushi speak.png" },
      { speaker: "Atsushi", text: "I'm just as worried as you are... but there's literally nothing we can do.", image: "Characters/Atsushi speak.png" },
      { speaker: "Kana", text: "Can't do anything? Or are you just refusing to do something about it?" },
      { speaker: "Atsushi", text: "...", image: "Characters/Atsushi Q (1).png" },
      { speaker: "Kana", text: "God, you're so damn pathetic" },
      { speaker: "Atsushi", text: "I'm sorry. Fine... then I'll look for clues myself.", image: "Characters/Atsushi speak.png" },
      { speaker: "Kana", text: "What can someone like you even do? Do whatever you want." },
      { speaker: "Atsushi", text: "Sorry...", image: "Characters/Atsushi Sorry.png" },
    ];

let currentIndex = 0;

    function nextText() {
      if (currentIndex < dialogs.length - 1) {
        currentIndex++;
        const currentDialog = dialogs[currentIndex];
        
        document.getElementById("speaker").innerText = currentDialog.speaker;
        document.getElementById("text").innerText = currentDialog.text;

        const atsushiImg = document.getElementById("char-atsushi");

        // --- ส่วนที่แก้ไขการสลับท่าทาง ---
        if (currentDialog.speaker === "Atsushi") {
          atsushiImg.classList.add("active"); // สว่างขึ้น
          // ใช้รูปท่าพูดตามที่ตั้งไว้ในประโยคนั้นๆ
          atsushiImg.src = currentDialog.image; 
        } else {
          atsushiImg.classList.remove("active"); // มืดลง
          // ตอนไม่ได้พูด ให้เปลี่ยนเป็นรูปท่าฟังเงียบๆ (ใส่ชื่อไฟล์รูปตอนฟังที่นี่)
          atsushiImg.src = "Characters/Atsushi Q (1).png"; 
        }
      }

      if (document.activeElement) {
        document.activeElement.blur();
      }
    }

    window.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.code === "Space") {
        event.preventDefault();
        nextText();
      }
    });
  </script>
</body>
</html>
