<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inoriba (祈り場) - Prologue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      color: #ff3333;
      margin-bottom: 5px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }
    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 20px;
    }

   /* ตัวจอเกมขยายเต็มหน้าจอเบราว์เซอร์ 100% */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050508;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 30px;
    }

    /* หัวข้อชื่อเกมลอยอยู่ด้านบน */
    .game-title {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }
    .game-title h1 {
      color: #ff3333;
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
    }
    .game-title p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 4px;
    }

    /* กล่องข้อความสไตล์ Visual Novel ขยายตามขนาดหน้าจอ (กว้าง 85% ของจอ) */
    #story-screen {
      position: relative;
      width: 85%;
      max-width: 1000px;
      min-height: 160px;
      background: rgba(8, 8, 12, 0.92);
      border: 2px solid #ff3333;
      border-radius: 6px;
      padding: 20px 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    .speaker-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ff4444;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .dialog-text {
      font-size: 1.15rem;
      color: #eeeeee;
      line-height: 1.6;
      flex-grow: 1;
    }

    .next-btn {
      align-self: flex-end;
      background: transparent;
      border: 1px solid #ff3333;
      color: #ff3333;
      padding: 6px 18px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .next-btn:hover {
      background: #ff3333;
      color: #000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <h1>祈り場 (Inoriba)</h1>
  <div class="subtitle">Hack Club Stardance Project</div>

  <div id="game-container">
    <div id="story-screen">
      <div class="speaker-name" id="speaker">???</div>
      <button class="next-btn" onclick="nextText()">กดเพื่อไปต่อ ▶</button>
    </div>
  </div>

  <script>
    const dialogs = [
      { speaker: "Atsushi", text: "It's been two weeks now, and the police still haven't found any trace of Riko." },
      { speaker: "Kana", text: "I wonder how our daughter is doing right now... The police are utterly useless. What on earth are our tax ｍoney even paying for?" },
      { speaker: "Atsushi", text: "Calm down, honey. The police are doing everything they can. I'm sure our daughter is still safe... I really believe that." },
      { speaker: "Kana", text: "I hope you're right. But how can you stay so calm? It's been way too long, and there's still zero progress." },
      { speaker: "Atsushi", text: "I'm just as worried as you are... but there's literally nothing we can do." },
      { speaker: "Kana", text: "Can't do anything? Or are you just refusing to do something about it?" },
      { speaker: "Atsushi", text: "..." },
      { speaker: "Kana", text: "God, you're so damn pathetic" },
      { speaker: "Atsushi", text: "I'm sorry. Fine... then I'll look for clues myself." },
      { speaker: "Kana", text: "What can someone like you even do? Do whatever you want." },
      { speaker: "Atsushi", text: "Sorry..." },
    ];

    let currentIndex = 0;

    function nextText() {
      currentIndex++;
      if (currentIndex < dialogs.length) {
        document.getElementById("speaker").innerText = dialogs[currentIndex].speaker;
        document.getElementById("text").innerText = dialogs[currentIndex].text;
      } else {
        document.getElementById("speaker").innerText = "ระบบ";
        document.getElementById("text").innerText = "จบฉากนำเรื่อง (Prologue)";
      }
    }
  </script>
</body>
</html>
